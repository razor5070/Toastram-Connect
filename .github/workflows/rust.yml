name: ToastRAM Connect Rust validation
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test core and C ABI
        run: cargo test --workspace --locked
      - name: Build release native libraries
        run: cargo build --workspace --release --locked
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test disposable account and legacy TLS endpoints
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install cryptography
          python tests/disposable_tls.py target/release/toastlink.exe
          python tests/account_tls.py target/release/toastlink_ffi.dll

      - name: Retain tested Windows account SDK
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: toastlink-windows-sdk-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/toastlink_ffi.dll
            target/release/toastlink_ffi.dll.lib
            target/release/toastlink.exe
            include/toast_account_v2.h
