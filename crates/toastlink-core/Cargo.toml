[package]
name = "toastlink-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline connection-file integrity primitives for ToastRAM Connect"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
x509-parser = { version = "0.18.1", default-features = false }
uuid = { version = "1", features = ["v4","serde"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = {version="3",features=["apple-native"]}
[target.'cfg(target_os = "linux")'.dependencies]
keyring = {version="3",features=["sync-secret-service","crypto-rust","vendored"]}
