[package]
name = "toastlink-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline connection-file integrity primitives for ToastRAM Connect"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
x509-parser = { version = "0.18.1", default-features = false }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
